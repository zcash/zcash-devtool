[package]
name = "tachyon-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
bs58 = { version = "0.5", features = ["check"] }
clap = { version = "4.5", features = ["derive"] }
ff = "0.14"
hex = "0.4"
pasta_curves = { package = "zakura-pasta-curves", version = "1.0.1" }
rand = { version = "0.10", features = ["std_rng"] }
udon = { package = "zakura-udon", version = "0.1.0", features = ["traits"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = "0.37"
secp256k1 = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ripemd = "0.1"
zcash_script = "0.4.3"
# TEMPORARY: tachyon fork pinned to upstream ragu main, including the proof
# wire decoder used by cached epoch and spendability proofs.
zcash_tachyon = { git = "https://github.com/cnode-agent/tachyon", rev = "c9140f5e373b5d24f8c7894a63c82f43cb7b0761" }
# Ragu is pinned to upstream main; the mock driver (#929) and wire (#949)
# changes are both merged there.
ragu = { git = "https://github.com/tachyon-zcash/ragu", rev = "bdf8112ec5e279e6d851b58145e84a1be79a4942", features = ["mock"] }
ragu_circuits = { git = "https://github.com/tachyon-zcash/ragu", rev = "bdf8112ec5e279e6d851b58145e84a1be79a4942" }
ragu_core = { git = "https://github.com/tachyon-zcash/ragu", rev = "bdf8112ec5e279e6d851b58145e84a1be79a4942", package = "ragu_core", default-features = false }
primitives = { package = "zakura-primitives", git = "https://github.com/cnode-agent/common.git", rev = "f21c6d99f20a58545d2eb222d5f2ef4654385bbf", default-features = false, features = ["std"] }
protocol = { package = "zakura-protocol", git = "https://github.com/cnode-agent/common.git", rev = "f21c6d99f20a58545d2eb222d5f2ef4654385bbf" }
transparent = { package = "zakura-transparent", git = "https://github.com/cnode-agent/common.git", rev = "f21c6d99f20a58545d2eb222d5f2ef4654385bbf" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nutachyon"))'] }
