[package]
name = "tachyon-wallet"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
anyhow = "1"
bs58 = { version = "0.5", features = ["check"] }
clap = { version = "4.5", features = ["derive"] }
ff = "0.14"
hex = "0.4"
pasta_curves = { package = "zakura-pasta-curves", version = "1.0.1" }
rand = { version = "0.10", features = ["std_rng"] }
udon = { package = "zakura-udon", version = "0.1.0", features = ["traits"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = "0.37"
secp256k1 = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ripemd = "0.1"
zcash_script = "0.4.3"
# TEMPORARY: integration branch containing ragu main, #929, and the mock
# wire format. Return to tachyon-zcash/ragu after those changes land upstream.
ragu = { git = "https://github.com/cnode-agent/ragu", branch = "c/mock-wire+driver", features = ["mock"] }
# TEMPORARY: same integration branch as ragu above.
ragu_circuits = { git = "https://github.com/cnode-agent/ragu", branch = "c/mock-wire+driver" }
# TEMPORARY: tachyon main plus #259/#260 and WireHeader support for cached
# epoch-bucket and spendability proofs. Return upstream after those land.
zcash_tachyon = { git = "https://github.com/cnode-agent/tachyon", branch = "c/mock-wire+driver" }
primitives = { package = "zakura-primitives", git = "https://github.com/cnode-agent/common.git", branch = "c/devtool-tachyon", default-features = false, features = ["std"] }
protocol = { package = "zakura-protocol", git = "https://github.com/cnode-agent/common.git", branch = "c/devtool-tachyon" }
transparent = { package = "zakura-transparent", git = "https://github.com/cnode-agent/common.git", branch = "c/devtool-tachyon" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nutachyon"))'] }
