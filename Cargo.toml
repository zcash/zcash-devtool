[package]
name = "zcash-devtool"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

[lints.rust]
# `zcash_unstable` is a `--cfg` set via RUSTFLAGS (not a Cargo feature) by the
# zcash crates to opt in to in-development network upgrades; declared here so the
# regtest/inspect code can gate on NU7 without tripping the `unexpected_cfgs` lint.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(zcash_unstable, values("nu7"))'] }

[dependencies]
anyhow = "1"
bip0039 = { version = "0.12", features = ["std", "all-languages"] }
bip32 = { version = "=0.6.0-pre.1", default-features = false, features = ["secp256k1-ffi"] }
futures-util = "0.3"
hex = "0.4"
jubjub = "0.10"
nonempty = { version = "0.11", default-features = false }
prost = "0.14"
rayon = "1.7"
ripemd = "0.1"
rusqlite = { version = "0.37", features = ["time"] }
schemerz = "0.2"
secp256k1 = { version = "0.29", features = ["serde"] }
secrecy = "0.8"
serde = "1.0"
time = "0.3"
tokio = { version = "1.21.0", features = ["fs", "io-std", "macros", "rt-multi-thread", "signal"] }
tokio-socks = "0.5"
toml = "0.8"
tonic = { version = "0.14", features = ["gzip", "tls-webpki-roots"] }
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1"

# Zcash
#
# NOTE: zcash_client_backend/zcash_client_sqlite/pczt/zip321 version reqs
# below are pinned to the exact prerelease versions published on Danny
# Willems' feat/pool-migration-sqlite branch (see [patch.crates-io] below) —
# these are ahead of the last crates.io releases. If the patch rev changes,
# re-check these against the new rev's Cargo.toml files, or Cargo will
# silently fall back to stale crates.io versions for the unsatisfied ones
# and duplicate half the dependency graph (as happened here).
orchard = { version = "0.15.0", default-features = false }
pczt = "0.8.0-rc.1"
sapling = { package = "sapling-crypto", version = "0.7" }
transparent = { package = "zcash_transparent", version = "0.9.0", features = ["test-dependencies"] }
zcash_address = "0.13.0"
zcash_client_backend = { version = "0.24.0-rc.1", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "pczt", "tor", "unstable"] }
# `transparent-inputs` is enabled unconditionally: `zcash_client_backend`'s `pczt`
# feature (always on here) already forces `zcash_client_backend/transparent-inputs`,
# so `zcash_client_sqlite` must match or its `WalletRead`/`WalletWrite` impls fail to
# cover the trait's transparent methods.
zcash_client_sqlite = { version = "0.22.0-rc.1", features = ["transparent-inputs", "unstable", "orchard", "serde", "test-dependencies"] }
zcash_keys = { version = "0.15.0", features = ["orchard", "unstable", "unstable-frost"] }
zcash_primitives = "0.29.0"
zcash_proofs = { version = "0.29.0", features = ["bundled-prover"] }
zcash_protocol = { version = "0.10.0", features = ["local-consensus"] }
zcash_script = "0.4"
zip32 = "0.2"
zip321 = "0.9.0-rc.1"

# Backend-agnostic value-pool migration engine (Orchard -> Ironwood, NU6.3).
# Not yet published to crates.io; lives on Danny Willems' feat/pool-migration-sqlite
# branch of librustzcash (zcash/librustzcash#2669, stacked on the approved
# #2663 engine) while the API is still evolving. Pinned to the same commit as
# the [patch.crates-io] block above. `wallet` feature pulls in the
# `WalletMigration` adapter used to drive the engine over our own WalletDb.
zcash_pool_migration_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593", features = ["wallet"] }
# The SQLite store for the migration (pool_migrations tables + the
# PoolMigrationRead/Write impls over the wallet database). Same rev as above.
zcash_pool_migration_sqlite = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }

# CLI
clap = { version = "4.5", features = ["derive", "string", "unstable-styles"] }

# CSPRNG
rand = { version = "0.8", default-features = false }

# Seed encryption
age = { version = "0.11", features = ["armor", "plugin"] }
chrono = "0.4"
rpassword = "7"

# Currency conversion
iso_currency = { version = "0.5", features = ["with-serde"] }
rust_decimal = "1"

# Inspect
bech32 = "0.11"
bellman = "0.14"
blake2b_simd = "1"
bs58 = "0.5"
ed25519-zebra = "4"
equihash = "0.2"
group = "0.13"
lazy_static = "1"
serde_json = "1"
sha2 = "0.10"
uint = "0.9"
zcash_encoding = "0.4"
zcash_note_encryption = "0.4.1"

# PCZT QR codes
image = { version = "0.25", optional = true }
minicbor = { version = "0.19", optional = true }
nokhwa = { version = "0.10", optional = true, features = ["input-native"] }
qrcode = { version = "0.14", optional = true, default-features = false }
rqrr = { version = "0.9", optional = true }
ur = { version = "0.4", optional = true }

# Tree exploration
incrementalmerkletree = "0.8"
shardtree = "0.7"

# TUI
crossterm = { version = "0.28", optional = true, features = ["event-stream"] }
ratatui = { version = "0.29", optional = true }
roaring = { version = "0.11", optional = true }
tokio-util = { version = "0.7", optional = true }
tui-logger = { version = "0.17", optional = true, features = ["tracing-support"] }

[features]
default = ["transparent-inputs"]
qr = ["dep:qrcode"]
regtest_support = ["zcash_protocol/local-consensus"]
pczt-qr = ["dep:image", "dep:minicbor", "dep:nokhwa", "dep:qrcode", "dep:rqrr", "dep:ur"]
transparent-inputs = [
    "zcash_client_sqlite/transparent-inputs",
]
tui = [
    "dep:crossterm",
    "dep:ratatui",
    "dep:roaring",
    "dep:tokio-util",
    "dep:tui-logger",
]

[patch.crates-io]
# Pinned to the tip of Danny Willems' feat/pool-migration-sqlite branch
# (zcash/librustzcash#2669, stacked on the approved #2663 migration engine)
# as of 2026-07-21 (re-synced from the original 2026-07-20 pin to pick up
# Kris Nuttycombe's one-phase signing + prove-via-PCZT-Updater rework), so
# this workspace gains the Ironwood pool-migration crates. Unreviewed/moving
# branch: pin to a fixed SHA, not a floating branch ref, and re-sync
# deliberately.
#
# orchard is patched here too, mirroring librustzcash's OWN
# [patch.crates-io] pin (orchard PR #535, deferred-anchor Updater setters)
# at this same commit -- a git dependency's own nested patches don't
# propagate to ours, so this workspace needs its own matching entry or the
# graph disagrees on which orchard it's building against.
orchard = { git = "https://github.com/zcash/orchard.git", rev = "63f4101e8bb6cd35d5c6aed6208455168362ee9f" }
equihash = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
f4jumble = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
zcash_address = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
zcash_encoding = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
zip321 = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
pczt = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
zcash_keys = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
zcash_proofs = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
zcash_transparent = { git = "https://github.com/zcash/librustzcash.git", rev = "27d50e831bb67dd6e79f61d2fa4efbe02cc22593" }
